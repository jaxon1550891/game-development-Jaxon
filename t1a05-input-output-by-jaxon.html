<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t1a05 Input Output - Jaxon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      margin: 0;
      padding: 30px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.35);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 5px;
    }

    h2 {
      color: white;
      margin-top: 5px;
    }

    .input-area {
      margin: 25px 0;
    }

    input[type="number"] {
      width: 180px;
      max-width: 100%;
      padding: 12px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      text-align: center;
    }

    button {
      background: #00a879;
      color: white;
      border: none;
      padding: 12px 18px;
      margin: 6px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #008f68;
      transform: scale(1.03);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #00ffcc;
      outline-offset: 3px;
    }

    /* NEW EQUALS BUTTON */
    .equals {
      background: #ff9800;
      font-size: 24px;
      font-weight: bold;
      min-width: 100px;
    }

    .equals:hover {
      background: #e68900;
    }

    .danger {
      background: #e74c3c;
    }

    .danger:hover {
      background: #c0392b;
    }

    #myDiv01 {
      background: white;
      color: #222;
      padding: 20px;
      margin-top: 25px;
      border-radius: 15px;
      font-size: 22px;
      min-height: 65px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .history {
      background: rgba(255, 255, 255, 0.1);
      margin-top: 25px;
      padding: 15px;
      border-radius: 15px;
    }

    #historyList {
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }

    .history-item {
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tip {
      color: #b8fff0;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      input[type="number"] {
        width: 100%;
      }

      button {
        padding: 10px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🧮 Jaxon's Input &amp; Output Calculator</h1>
    <h2>t1a05 - JavaScript Input Output</h2>

    <p class="tip">
      Enter a number and try the different buttons!
      Press = or Enter to calculate the square.
    </p>

    <div class="input-area">

      <input
        id="mynum01"
        type="number"
        value="4"
        step="any"
        placeholder="Enter a number"
        aria-label="Enter a number"
        onkeydown="checkEnter(event)"
      >

      <br><br>

      <!-- NEW EQUALS BUTTON -->
      <button type="button" class="equals" onclick="squareNumber()">
        = Calculate
      </button>

      <br><br>

      <button type="button" onclick="squareNumber()">x² Square</button>
      <button type="button" onclick="cubeNumber()">x³ Cube</button>
      <button type="button" onclick="doubleNumber()">×2 Double</button>
      <button type="button" onclick="halfNumber()">÷2 Half</button>
      <button type="button" onclick="sqrtNumber()">√ Square Root</button>
      <button type="button" onclick="powerNumber()">x⁵ Power</button>

      <br>

      <button type="button" onclick="evenOdd()">Even or Odd?</button>
      <button type="button" onclick="positiveNegative()">Positive or Negative?</button>
      <button type="button" onclick="randomNumber()">🎲 Random Number</button>
      <button type="button" onclick="factorialNumber()">! Factorial</button>

      <br>

      <button type="button" class="danger" onclick="clearResult()">
        Clear Result
      </button>

    </div>

    <div id="myDiv01" role="status" aria-live="polite">
      Your answer will appear here...
    </div>

    <div class="history">
      <h2>📜 History</h2>

      <div id="historyList" aria-live="polite">
        No calculations yet.
      </div>

      <br>

      <button type="button" class="danger" onclick="clearHistory()">
        Clear History
      </button>
    </div>

  </div>

  <script>
    // GET AND VALIDATE THE INPUT NUMBER
    function getNumber() {
      const input = document.getElementById("mynum01");
      const value = input.value.trim();

      if (value === "") {
        showAnswer("⚠️ Please enter a number!");
        input.focus();
        return null;
      }

      const number = Number(value);

      if (!Number.isFinite(number)) {
        showAnswer("⚠️ Please enter a valid, finite number!");
        input.focus();
        return null;
      }

      return number;
    }

    // DISPLAY AN ANSWER
    function showAnswer(answer) {
      document.getElementById("myDiv01").textContent = answer;
    }

    // ADD A CALCULATION TO HISTORY
    function addHistory(calculation) {
      const history = document.getElementById("historyList");

      if (history.dataset.hasItems !== "true") {
        history.textContent = "";
        history.dataset.hasItems = "true";
      }

      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = "➡️ " + calculation;

      history.appendChild(item);
      history.scrollTop = history.scrollHeight;
    }

    // DISPLAY AND SAVE A NUMERIC RESULT
    function calculateResult(calculation, answer) {
      if (!Number.isFinite(answer)) {
        showAnswer("⚠️ The result is too large to calculate.");
        return;
      }

      const result = `${calculation} = ${answer}`;
      showAnswer(result);
      addHistory(result);
    }

    // SQUARE — ALSO USED BY THE NEW = BUTTON
    function squareNumber() {
      const number = getNumber();
      if (number === null) return;

      calculateResult(`${number}²`, number ** 2);
    }

    // CUBE
    function cubeNumber() {
      const number = getNumber();
      if (number === null) return;

      calculateResult(`${number}³`, number ** 3);
    }

    // DOUBLE
    function doubleNumber() {
      const number = getNumber();
      if (number === null) return;

      calculateResult(`${number} × 2`, number * 2);
    }

    // HALF
    function halfNumber() {
      const number = getNumber();
      if (number === null) return;

      calculateResult(`${number} ÷ 2`, number / 2);
    }

    // SQUARE ROOT
    function sqrtNumber() {
      const number = getNumber();
      if (number === null) return;

      if (number < 0) {
        showAnswer("❌ A negative number has no real square root.");
        return;
      }

      calculateResult(`√${number}`, Math.sqrt(number));
    }

    // POWER OF FIVE
    function powerNumber() {
      const number = getNumber();
      if (number === null) return;

      calculateResult(`${number}⁵`, number ** 5);
    }

    // EVEN OR ODD
    function evenOdd() {
      const number = getNumber();
      if (number === null) return;

      if (!Number.isInteger(number)) {
        showAnswer("ℹ️ Even or odd only works with whole numbers.");
        return;
      }

      const result = number % 2 === 0
        ? `${number} is EVEN 🟢`
        : `${number} is ODD 🔵`;

      showAnswer(result);
      addHistory(result);
    }

    // POSITIVE, NEGATIVE, OR ZERO
    function positiveNegative() {
      const number = getNumber();
      if (number === null) return;

      let result;

      if (number > 0) {
        result = `${number} is POSITIVE ➕`;
      } else if (number < 0) {
        result = `${number} is NEGATIVE ➖`;
      } else {
        result = "The number is ZERO 0️⃣";
      }

      showAnswer(result);
      addHistory(result);
    }

    // RANDOM WHOLE NUMBER FROM ZERO TO THE INPUT
    function randomNumber() {
      const number = getNumber();
      if (number === null) return;

      if (number < 0) {
        showAnswer("⚠️ Enter zero or a positive number for the random limit.");
        return;
      }

      const max = Math.floor(number);

      if (!Number.isSafeInteger(max)) {
        showAnswer("⚠️ Please enter a smaller number.");
        return;
      }

      const random = Math.floor(Math.random() * (max + 1));
      const result = `🎲 Random number from 0 to ${max} = ${random}`;

      showAnswer(result);
      addHistory(result);
    }

    // FACTORIAL
    function factorialNumber() {
      const number = getNumber();
      if (number === null) return;

      if (!Number.isInteger(number) || number < 0) {
        showAnswer("⚠️ Factorial requires a whole number 0 or greater.");
        return;
      }

      if (number > 170) {
        showAnswer("⚠️ Please use a number from 0 to 170.");
        return;
      }

      let answer = 1;

      for (let i = 1; i <= number; i++) {
        answer *= i;
      }

      calculateResult(`${number}!`, answer);
    }

    // CLEAR ONLY THE CURRENT RESULT
    function clearResult() {
      showAnswer("Your answer will appear here...");
    }

    // CLEAR ALL HISTORY
    function clearHistory() {
      const history = document.getElementById("historyList");

      history.textContent = "No calculations yet.";
      history.dataset.hasItems = "false";
    }

    // PRESS ENTER TO CALCULATE
    function checkEnter(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        squareNumber();
      }
    }
  </script>
</body>
</html>
