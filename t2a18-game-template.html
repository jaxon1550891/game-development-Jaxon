<!DOCTYPE html>
<html>
<head>
<title>t2a18-game-template-fred</title>

<style>
    body {
        background-image: url('myBackground01.jpg');
        background-repeat: repeat;
        background-size: 80%;
        font-family: Arial;
        overflow: hidden;
    }

    h1 {
        text-align: center;
        color: blue;
    }

    input {
        padding: 8px;
        margin: 4px;
        cursor: pointer;
    }

    #myScore {
        font-size: 20px;
        font-weight: bold;
    }
</style>
</head>

<body id="myBody">

<h1>t2a18-game-template-fred</h1>

<p id="myScore">Score: 0</p>

<script>

// Global variables
let myGlobalX = 0
let myClock
let myScore = 0
let mySpeed = 10

// Collision detection
function myHitOther(my1,my2) {

    let myObj1 = document.getElementById(my1)
    let myObj2 = document.getElementById(my2)

    let left1 = parseInt(myObj1.style.left)
    let right1 = left1 + parseInt(myObj1.style.width)
    let top1 = parseInt(myObj1.style.top)
    let bottom1 = top1 + parseInt(myObj1.style.height)

    let left2 = parseInt(myObj2.style.left)
    let right2 = left2 + parseInt(myObj2.style.width)
    let top2 = parseInt(myObj2.style.top)
    let bottom2 = top2 + parseInt(myObj2.style.height)

    return (
        right1 >= left2 &&
        bottom1 >= top2 &&
        left1 <= right2 &&
        top1 <= bottom2
    )
}

// Check collisions
function myCheckHit() {

    if (myHitOther('myImg01','myImg02')) {

        myScore += 1

        document.getElementById('myScore').innerHTML =
            'Score: ' + myScore

        alert('You got a point!')

        // Reset player position
        document.getElementById('myImg01').style.left = '50px'
        document.getElementById('myImg01').style.top = '100px'

        // Move target
        document.getElementById('myImg02').style.left =
            (Math.random() * 400 + 200) + 'px'

        document.getElementById('myImg02').style.top =
            (Math.random() * 300 + 100) + 'px'
    }
}

// Move player
function myMove(myDirection) {

    let myPlayer = document.getElementById('myImg01')

    if (myDirection == 'right') {
        myPlayer.style.left =
            (parseInt(myPlayer.style.left) + mySpeed) + 'px'
    }

    if (myDirection == 'left') {
        myPlayer.style.left =
            (parseInt(myPlayer.style.left) - mySpeed) + 'px'
    }

    if (myDirection == 'up') {
        myPlayer.style.top =
            (parseInt(myPlayer.style.top) - mySpeed) + 'px'
    }

    if (myDirection == 'down') {
        myPlayer.style.top =
            (parseInt(myPlayer.style.top) + mySpeed) + 'px'
    }

    myCheckHit()
}

// Move background
function myBackgroundMove(myDirection) {

    clearInterval(myClock)

    myClock = setInterval(function() {

        if (myDirection == 'left') {
            myGlobalX -= 5
        }

        if (myDirection == 'right') {
            myGlobalX += 5
        }

        document.getElementById('myBody').style.backgroundPosition =
            myGlobalX + 'px 0px'

    }, 100)
}

// Stop background
function myStopBackground() {
    clearInterval(myClock)
}

// Reset game
function myReset() {

    myScore = 0

    document.getElementById('myScore').innerHTML = 'Score: 0'

    document.getElementById('myImg01').style.left = '50px'
    document.getElementById('myImg01').style.top = '100px'

    document.getElementById('myImg02').style.left = '250px'
    document.getElementById('myImg02').style.top = '100px'

    myStopBackground()
}

// Keyboard controls
document.onkeydown = function(myEvent) {

    if (myEvent.key == 'ArrowRight') myMove('right')
    if (myEvent.key == 'ArrowLeft') myMove('left')
    if (myEvent.key == 'ArrowUp') myMove('up')
    if (myEvent.key == 'ArrowDown') myMove('down')

}

</script>

<!-- Game Images -->

<img id="myImg01"
style="position:absolute; width:100px; height:80px; top:100px; left:50px;"
src="myImage01.jpg">

<img id="myImg02"
style="position:absolute; width:100px; height:80px; top:100px; left:250px;"
src="myImage02.jpg">

<br><br><br><br><br><br><br><br>

<!-- Background Controls -->

<input type="button"
value="Background Left"
onclick="myBackgroundMove('left')">

<input type="button"
value="Background Right"
onclick="myBackgroundMove('right')">

<input type="button"
value="Stop Background"
onclick="myStopBackground()">

<br>

<!-- Player Controls -->

<input type="button"
value="⬅ Left"
onclick="myMove('left')">

<input type="button"
value="➡ Right"
onclick="myMove('right')">

<input type="button"
value="⬆ Up"
onclick="myMove('up')">

<input type="button"
value="⬇ Down"
onclick="myMove('down')">

<br>

<input type="button"
value="Reset Game"
onclick="myReset()">

</body>
</html>
