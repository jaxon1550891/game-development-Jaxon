<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t1a05 Input Output - Jaxon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      margin: 0;
      padding: 30px;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: 20px auto;
      background: rgba(0, 0, 0, 0.35);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #00ffcc;
      font-size: 25px;
    }

    h2 {
      font-size: 16px;
      font-weight: normal;
    }

    #display {
      width: 100%;
      height: 80px;
      padding: 15px;
      margin: 15px 0;
      border: none;
      border-radius: 10px;
      background: #eaf5ed;
      color: #222;
      font-size: 34px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    button {
      min-width: 0;
      height: 58px;
      border: none;
      border-radius: 10px;
      background: #00a879;
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 3px 0 #075b49;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    button:focus-visible {
      outline: 3px solid #00ffcc;
      outline-offset: 2px;
    }

    .operator {
      background: #ff9800;
      color: #222;
      box-shadow: 0 3px 0 #a85b00;
    }

    .clear {
      background: #e74c3c;
      box-shadow: 0 3px 0 #922b21;
    }

    .equals {
      background: #00ffcc;
      color: #123;
      box-shadow: 0 3px 0 #00a889;
    }

    .zero {
      grid-column: span 2;
    }

    .tip {
      color: #b8fff0;
      font-size: 14px;
      margin-top: 20px;
    }

    @media (max-width: 450px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
      }

      button {
        height: 54px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🧮 Jaxon's Calculator</h1>
    <h2>t1a05 - JavaScript Input Output</h2>

    <input
      id="display"
      type="text"
      value="0"
      readonly
      aria-label="Calculator display"
    >

    <div class="buttons">
      <button class="clear" onclick="clearCalculator()">AC</button>
      <button onclick="deleteDigit()">DEL</button>
      <button class="operator" onclick="percentage()">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="pressNumber('7')">7</button>
      <button onclick="pressNumber('8')">8</button>
      <button onclick="pressNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="pressNumber('4')">4</button>
      <button onclick="pressNumber('5')">5</button>
      <button onclick="pressNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="pressNumber('1')">1</button>
      <button onclick="pressNumber('2')">2</button>
      <button onclick="pressNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="changeSign()">+/−</button>
      <button class="zero" onclick="pressNumber('0')">0</button>
      <button onclick="pressDecimal()">.</button>

      <button class="equals" onclick="calculate()" style="grid-column: span 4">=</button>
    </div>

    <p class="tip">
      Click the numbers and operations, then press = for your answer.
    </p>

  </div>

  <script>
    const display = document.getElementById("display");

    let current = "0";
    let stored = null;
    let operation = null;
    let startNew = false;
    let finished = false;

    function updateDisplay() {
      display.value = current;
    }

    // CLICK NUMBER BUTTONS
    function pressNumber(number) {
      if (current === "Error") clearCalculator();

      if (startNew || finished) {
        current = number;
        startNew = false;
        finished = false;
      } else if (current === "0") {
        current = number;
      } else if (current.replace("-", "").length < 15) {
        current += number;
      }

      updateDisplay();
    }

    // DECIMAL BUTTON
    function pressDecimal() {
      if (current === "Error") clearCalculator();

      if (startNew || finished) {
        current = "0.";
        startNew = false;
        finished = false;
      } else if (!current.includes(".")) {
        current += ".";
      }

      updateDisplay();
    }

    // SELECT +, -, × OR ÷
    function chooseOperator(nextOperation) {
      if (current === "Error") return;

      if (operation !== null && !startNew) {
        calculate(false);
        if (current === "Error") return;
      }

      stored = Number(current);
      operation = nextOperation;
      startNew = true;
      finished = false;
    }

    // CALCULATE THE ANSWER
    function calculate(finalAnswer = true) {
      if (operation === null || stored === null || startNew) return;

      const second = Number(current);
      let answer;

      switch (operation) {
        case "+":
          answer = stored + second;
          break;

        case "-":
          answer = stored - second;
          break;

        case "*":
          answer = stored * second;
          break;

        case "/":
          if (second === 0) {
            current = "Error";
            stored = null;
            operation = null;
            startNew = true;
            finished = true;
            updateDisplay();
            return;
          }
          answer = stored / second;
          break;
      }

      if (!Number.isFinite(answer)) {
        current = "Error";
      } else {
        current = String(Number(answer.toPrecision(12)));
      }

      stored = null;
      operation = null;
      startNew = true;
      finished = finalAnswer;
      updateDisplay();
    }

    // CLEAR EVERYTHING
    function clearCalculator() {
      current = "0";
      stored = null;
      operation = null;
      startNew = false;
      finished = false;
      updateDisplay();
    }

    // DELETE LAST DIGIT
    function deleteDigit() {
      if (current === "Error" || finished) {
        clearCalculator();
        return;
      }

      if (startNew) return;

      current = current.length > 1
        ? current.slice(0, -1)
        : "0";

      if (current === "-") current = "0";

      updateDisplay();
    }

    // CHANGE POSITIVE TO NEGATIVE OR VICE VERSA
    function changeSign() {
      if (current === "Error") return;

      if (Number(current) !== 0) {
        current = current.startsWith("-")
          ? current.slice(1)
          : "-" + current;
      }

      startNew = false;
      finished = false;
      updateDisplay();
    }

    // CONVERT THE DISPLAYED NUMBER TO A PERCENTAGE
    function percentage() {
      if (current === "Error") return;

      current = String(Number(current) / 100);
      startNew = false;
      finished = false;
      updateDisplay();
    }
  </script>
</body>
</html>
