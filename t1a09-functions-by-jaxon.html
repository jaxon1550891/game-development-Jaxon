<div class="extra-game">
  <h2>🎲 Dice Roller</h2>
  <p>Choose how many dice you want to roll!</p>

  <select id="diceCount">
    <option value="1">1 Die</option>
    <option value="2" selected>2 Dice</option>
    <option value="3">3 Dice</option>
    <option value="4">4 Dice</option>
    <option value="5">5 Dice</option>
    <option value="6">6 Dice</option>
  </select>

  <br>

  <button onclick="rollDice()">🎲 Roll Dice!</button>

  <div id="diceResult" class="game-result">
    Your dice will appear here!
  </div>
</div>

<!-- COIN FLIP -->
<div class="extra-game">
  <h2>🪙 Coin Flip</h2>
  <p>Click the button to flip a coin!</p>

  <button onclick="flipCoin()">🪙 Flip Coin!</button>

  <div id="coinResult" class="game-result">
    Ready to flip!
  </div>
</div>

<style>
  .extra-game {
    max-width: 800px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.35);
    color: white;
    text-align: center;
  }

  .extra-game h2 {
    color: #00ffcc;
  }

  .extra-game select {
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    font-size: 16px;
  }

  .game-result {
    margin-top: 20px;
    padding: 15px;
    min-height: 70px;
    border-radius: 12px;
    background: white;
    color: #222;
    font-size: 22px;
    font-weight: bold;
    overflow-wrap: anywhere;
  }

  .dice {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 55px;
    height: 55px;
    margin: 5px;
    border-radius: 10px;
    background: #ffffff;
    color: #1e3c72;
    font-size: 35px;
    box-shadow: 0 3px 8px #0003;
  }

  .coin {
    font-size: 65px;
    display: block;
    margin: 10px;
  }
</style>

<script>
  // DICE ROLLER
  function rollDice() {
    const count = Number(document.getElementById("diceCount").value);
    const result = document.getElementById("diceResult");

    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
    let total = 0;
    let diceHTML = "";

    for (let i = 0; i < count; i++) {
      const roll = Math.floor(Math.random() * 6) + 1;
      total += roll;

      diceHTML += `<span class="dice" aria-label="${roll}">${diceFaces[roll - 1]}</span>`;
    }

    result.innerHTML =
      diceHTML +
      `<p>Total: ${total}</p>`;
  }

  // COIN FLIP
  function flipCoin() {
    const result = document.getElementById("coinResult");
    const heads = Math.random() < 0.5;

    result.innerHTML = heads
      ? '<span class="coin">🪙</span> HEADS!'
      : '<span class="coin">🪙</span> TAILS!';
  }
</script>
